services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    mem_limit: ${DYNAMODB_MEMORY_LIMIT:-512m}
    memswap_limit: ${DYNAMODB_MEMORY_SWAP_LIMIT:-512m}
    cpus: ${DYNAMODB_CPU_LIMIT:-0.5}
    restart: on-failure:3
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb"
    healthcheck:
      test:
        ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/ || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "node node_modules/esbuild/install.js && (npm run db:migrate || true) && npm run dev:docker"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=${APP_NODE_OPTIONS:---max-old-space-size=1024}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_BASE_URL=${DEEPSEEK_API_BASE_URL:-}
      - DEEPSEEK_CHAT_MODEL=${DEEPSEEK_CHAT_MODEL:-}
      - DEEPSEEK_REASONER_MODEL=${DEEPSEEK_REASONER_MODEL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS:-}
      - BROKER_TYPE=${BROKER_TYPE:-stub}
      - BROKER_API_BASE_URL=${BROKER_API_BASE_URL:-}
      - BROKER_API_KEY_HEADER=${BROKER_API_KEY_HEADER:-}
    mem_limit: ${APP_MEMORY_LIMIT:-1536m}
    memswap_limit: ${APP_MEMORY_SWAP_LIMIT:-1536m}
    cpus: ${APP_CPU_LIMIT:-1.5}
    restart: on-failure:3
    volumes:
      - .:/app
      - /app/.next
    ports:
      - "8080:8080"
    depends_on:
      dynamodb-local:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    memswap_limit: ${REDIS_MEMORY_SWAP_LIMIT:-256m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    restart: on-failure:3
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  bot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "node node_modules/esbuild/install.js && (npm run db:migrate || true) && npm run bot:start; exec tail -f /dev/null"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - BOT_DRY_RUN=${BOT_DRY_RUN:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_BASE_URL=${DEEPSEEK_API_BASE_URL:-}
      - DEEPSEEK_CHAT_MODEL=${DEEPSEEK_CHAT_MODEL:-}
      - DEEPSEEK_REASONER_MODEL=${DEEPSEEK_REASONER_MODEL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS:-}
      - BROKER_TYPE=${BROKER_TYPE:-stub}
      - BROKER_API_BASE_URL=${BROKER_API_BASE_URL:-}
      - BROKER_API_KEY_HEADER=${BROKER_API_KEY_HEADER:-}
    mem_limit: ${BOT_MEMORY_LIMIT:-768m}
    memswap_limit: ${BOT_MEMORY_SWAP_LIMIT:-768m}
    cpus: ${BOT_CPU_LIMIT:-1}
    volumes:
      - .:/app
      - /app/.next
    depends_on:
      dynamodb-local:
        condition: service_healthy
      redis:
        condition: service_healthy
