    description: "Бот показывает открытые позиции пользователя (из GET
      /positions/{accountId}/active API Upscale), но не показывает
      нереализованную прибыль/убыток (P&L) по ним. По документации Upscale
      нереализованный PnL не входит в ответ /positions/{accountId}/active — его
      нужно брать из статуса риска (GET /accounts/{accountId}/risk-status:
      currentEquity минус currentBalance даёт суммарный нереализованный PnL) или
      из рыночного снимка (GET /v2/markets: state.indexPrice против цены входа
      позиции). Нужно исправить UpscaleBroker (broker/upscale.ts) и/или
      форматирование позиций (bot/format.ts, bot/account.ts), чтобы команда
      /positions показывала нереализованный P&L по каждой открытой позиции: для
      каждой позиции считать unrealized PnL = (indexPrice - entryPrice) * size
      для long, (entryPrice - indexPrice) * size для short, где entryPrice можно
      получить из notional/size позиции, а indexPrice — из рыночного снимка.
      Если рыночный снимок недоступен — можно показать суммарный P&L из
      risk-status (currentEquity - currentBalance) или пометить P&L как
      недоступный, но не показывать пустоту. Сохранить обратную совместимость со
      StubBroker."
    status: completed
    acceptance_criteria:
      - Запрос пользователя выполнен полностью
    meta:
      quick_implement_marker: quick_implement:call_resp_01a13d2d-1bf7-7b05-b7df-caa943b7ebd1_0
    summary: "Команда /positions теперь показывает нереализованный P&L по каждой
      открытой позиции Upscale. В broker/upscale.ts positionUnrealizedPnl
      считает P&L = (indexPrice - entryPrice) * size для long и обратное для
      short (entryPrice из позиции или notional/size, indexPrice из рыночного
