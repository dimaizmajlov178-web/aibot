      - При открытии позиции бот отправляет POST /orders с stopTriggerPrice
        (стоп-лосс) и takeTriggerPrice (тейк-профит), рассчитанными от цены
        входа и настроек
      - Стоп-лосс по позиции не больше заданного процента; позиция может быть
        открыта со стопом меньше заданного, но не больше
      - Сделки открываются с максимальным плечом, разрешённым рынком/фазой;
