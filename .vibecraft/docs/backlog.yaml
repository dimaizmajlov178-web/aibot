      redis — весь проект (бот, DynamoDB, Redis) поднимается одной командой.
      Основная реализация: pycore/, tests/, pyproject.toml, docker-compose.yml."
  - id: task-9978
    title: "Инструкция: перенос бота на сервер"
    description: "Пользователь спрашивает: «как мне перенести бота на сервер?».
      Нужно изучить конфигурацию проекта (docker-compose, переменные окружения,
      команды запуска, зависимости) и подготовить пошаговую инструкцию для
      переноса бота на отдельный сервер: что скопировать, какие секреты и
      переменные окружения заполнить на сервере, как запустить проект одной
      командой и как убедиться, что бот работает. Файлы проекта менять нельзя —
      это readonly-задача. Ответ пользователю записать в summary
      completed-задачи."
    status: completed
    acceptance_criteria:
      - Задача завершена со статусом completed
      - "В summary задачи содержится понятная пользователю инструкция по
        переносу бота на сервер: какие файлы нужны, какие переменные окружения
        заполнить, какая команда запускает проект, как проверить, что бот
        работает"
    summary: "Перенос бота на сервер: скопируйте весь репозиторий (код, а не
      node_modules/.next) на сервер с установленными Docker и Docker Compose.
      Создайте из .env.example файл .env и заполните секреты: TELEGRAM_BOT_TOKEN
      (от @BotFather), DEEPSEEK_API_KEY, ENCRYPTION_KEY (команда генерации — в
      комментарии .env.example), ADMIN_TELEGRAM_IDS, опционально REDIS_URL и
      параметры брокера (BROKER_TYPE/BROKER_API_BASE_URL/BROKER_API_KEY_HEADER)
      с лимитами риска; BOT_DRY_RUN=false. Docker compose сам поднимает DynamoDB
      и Redis и мигрирует схему (команда db:migrate в сервисах app/bot). Запуск
      одной командой: docker compose up -d --build (или npm run docker:dev).
      Проверка: docker compose ps — все сервисы healthy; docker compose logs bot
      — строка «бот запущен и подключён к Telegram»; затем напишите боту /start
      — он должен ответить."
  - id: task-0696
    title: "Пошаговая инструкция: перенос на пустой сервер через GitHub"
    description:
      "Пользователь спрашивает: «Говори пошагово что делать, у меня есть
      пустой сервер. Переносить на него будем через гит хаб». Нужно изучить
      конфигурацию проекта (docker-compose, .env.example, команды запуска,
      зависимости) и подготовить пошаговую инструкцию для переноса бота на
      пустой сервер через GitHub: 1) как загрузить проект в GitHub-репозиторий
      (если ещё не загружен), 2) как подключиться к серверу по SSH, 3) что
      установить на сервере (git, Docker, Docker Compose), 4) как склонировать
      репозиторий, 5) как создать .env из .env.example и какие секреты
      заполнить, 6) какая команда запускает проект, 7) как проверить, что бот
      работает. Файлы проекта менять нельзя — это readonly-задача. Ответ
      пользователю записать в summary completed-задачи."
    status: completed
    acceptance_criteria:
      - Задача завершена со статусом completed
      - "В summary задачи содержится пошаговая инструкция для переноса бота на
        пустой сервер через GitHub: как загрузить код в GitHub (если ещё не
        загружен), как подключиться к серверу, какие пакеты установить (Docker,
        Docker Compose, git), как склонировать репозиторий, как создать и
        заполнить .env, какая команда запускает проект, как проверить, что бот
        работает"
    summary:
      "Перенос через GitHub: 1) создайте пустой репо на github.com и залейте
      код: `git remote add origin URL && git push -u origin main` (.env в
      .gitignore — секреты не уедут). 2) `ssh user@IP`. 3) Установите git,
      Docker+Compose (`curl -fsSL https://get.docker.com | sh`) и Node 24 (для
      `npm install`). 4) `git clone URL && cd repo`; 5) `npm install`
      (node_modules не в git). 6) `cp .env.example .env`, заполните
      TELEGRAM_BOT_TOKEN (BotFather), DEEPSEEK_API_KEY, ENCRYPTION_KEY (команда
      генерации в комментарии .env.example), ADMIN_TELEGRAM_IDS, лимиты риска,
      BOT_DRY_RUN=false (.env.docker с настройками DynamoDB уже в репо). 7)
      Запуск: `docker compose up -d --build` (bot сам мигрирует схему). 8)
      Проверка: `docker compose ps` — все healthy; `docker compose logs bot` —
      «бот запущен и подключён к Telegram»; затем напишите боту /start."
  - id: task-2453
    title: "Пошаговая инструкция: загрузка через PowerShell и перенос на сервер"
    description:
      "Пользователь уточнил: «на гит хаб будем грузить через повершел с
      рабочего стола». Нужно изучить конфигурацию проекта (docker-compose,
      .env.example, команды запуска, зависимости, .gitignore) и подготовить
      пошаговую инструкцию для переноса бота на пустой сервер через GitHub, где
      загрузка кода в GitHub выполняется через PowerShell с рабочего стола
      (Windows): 1) как подготовить проект к загрузке (проверить .gitignore, что
      .env не попадёт в репозиторий), 2) как создать репозиторий на GitHub, 3)
      какие команды PowerShell выполнить на рабочем столе для загрузки кода (git
      init/add/commit/branch/remote/push), 4) как подключиться к серверу по SSH,
      5) что установить на сервере (git, Docker, Docker Compose), 6) как
      склонировать репозиторий, 7) как создать .env из .env.example и какие
      секреты заполнить, 8) какая команда запускает проект, 9) как проверить,
      что бот работает. Файлы проекта менять нельзя — это readonly-задача. Ответ
      пользователю записать в summary completed-задачи."
    status: completed
    acceptance_criteria:
      - Задача завершена со статусом completed
      - "В summary задачи содержится пошаговая инструкция для переноса бота на
        пустой сервер через GitHub, где загрузка кода в GitHub выполняется через
        PowerShell с рабочего стола (Windows): как подготовить проект к
        загрузке, как создать репозиторий на GitHub, какие команды PowerShell
        выполнить для загрузки кода, как убедиться, что секреты (.env) не
        попадут в репозиторий, как подключиться к серверу по SSH, какие пакеты
        установить на сервере (git, Docker, Docker Compose), как склонировать
        репозиторий, как создать и заполнить .env, какая команда запускает
        проект, как проверить, что бот работает"
    summary: 'Перенос через GitHub, загрузка через PowerShell: .env уже в
      .gitignore — секреты не попадут в репозиторий. 1) Создайте пустой репо на
      github.com. 2) PowerShell: git init; git add .; git commit -m "init"; git
      branch -M main; git remote add origin URL; git push -u origin main. 3) ssh
      user@IP. 4) Установите git и Docker+Compose: curl -fsSL
      https://get.docker.com | sh. 5) git clone URL && cd repo. 6) cp
      .env.example .env; заполните TELEGRAM_BOT_TOKEN, DEEPSEEK_API_KEY,
      ENCRYPTION_KEY (генерация в комментарии .env.example), ADMIN_TELEGRAM_IDS,
      лимиты риска; BOT_DRY_RUN=false. 7) docker compose up -d --build. 8)
      Проверка: docker compose ps (все healthy); docker compose logs bot — «бот
      запущен и подключён к Telegram»; затем /start боту.'
