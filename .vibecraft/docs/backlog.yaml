  - id: task-3925
    title: Подключить реального брокера Upscale вместо заглушки StubBroker.
      Пользователь прислал полную документацию API Upscale...
    description: >-
      Подключить реального брокера Upscale вместо заглушки StubBroker.
      Пользователь прислал полную документацию API Upscale
      (https://api.upscale.trade). Нужно реализовать UpscaleBroker на основе
      абстрактного BaseBroker, чтобы команды /connect, /status, /positions,
      /stats показывали реальные данные счёта, а торговое ядро
      открывало/закрывало реальные сделки через API.


      Ключевые детали API Upscale:

      - Базовый URL: https://api.upscale.trade

      - Авторизация: заголовок Authorization: Bearer usk_<ключ> (персональный
      API-ключ с префиксом usk_)

      - Все суммы/цены/плечи — fp9: необработанные целочисленные строки,
      значение × 10^9 (100 USD = "100000000000", 10x плечо = "10000000000").
      Читать/писать через BigInt/Decimal, не через float.

      - Ошибки: { statusCode, message, error } где error — стабильный
      машиночитаемый код (branch по error, не по message). 401 — неавторизован,
      403 — account_access_denied / api_trading_not_enabled и др., 404 — not
      found, 409 — idempotency_key_in_flight, 429 — rate limit (Retry-After).

      - Лимиты: 10 req/s и 60 req/min на чтение (GET), столько же на запись
      (остальное), по ключу.

      - Для запросов на запись (POST/PATCH/DELETE) отправлять заголовок
      x-idempotency-key (uuid v4); повторный вызов с тем же ключом в течение 1
      часа воспроизводит сохранённый ответ.


      Основные эндпоинты:

      1. GET /accounts/with-risk-status — список счетов со статусом риска
      (accountId, status, type: demo/real/tournament, apiTrading,
      accountBalance, initialAccountBalance, currentPhase,
      riskStatus{currentBalance, currentEquity, dayStartEquity, maxEquity,
      tradingDays, ...}). Для тестового вызова balance при /connect использовать
      этот эндпоинт: найти активный счёт с apiTrading=true.

      2. GET /accounts/{accountId}/risk-status — снимок риска: currentBalance,
      currentEquity, dayStartEquity, maxEquity, tradingDays, consistencyRuleMet,
      payoutBaselineBalance и др.

      3. GET /accounts/{accountId}/stats — статистика по закрытым позициям:
      sumPnl, profit, positionsCount, profitablePositionsCount,
      unprofitablePositionsCount, winratePercent, avgProfit, avgLoss,
      riskRewardRatio, maxDrawdownPercent, avgPositionHoldTime и др.

      4. GET /accounts/{accountId}/equity-history?timestamp=&duration= — история
      эквити (массив {timestamp, volume, phaseIndex, phaseStartEquity}).

      5. GET /v2/markets?accountId=... — торгуемые рынки: id, config{baseAsset,
      ticker, ...}, state{indexPrice, ...}, settings{minLeverage, maxLeverage,
      fees...}. Для OHLCV/свечей этого эндпоинта нет — рыночные данные для AI
      можно брать из state.indexPrice и change (1h/4h/24h), либо оставить
      заглушку для индикаторов.

      6. POST /orders — создание ордера. Тело: { accountId, marketId, type:
      "market"|"take"|"limit"|"stop"|"stop_market"|"stop_limit"|"trailing_stop",
      direction: "long"|"short", amount (fp9; для market-ордера на открытие —
      quote-сумма резерва, для take-ордера на закрытие — base-размер позиции),
      leverage (fp9, только для ордеров на увеличение), expectedAmount,
      triggerPrice, positionId (для ордеров на закрытие), stopTriggerPrice,
      takeTriggerPrice }. Ответ: OrderResponse { id, status:
      active/executed/canceled..., type, direction, amount, indexPrice,
      realizedPnl, createdAt, errorCode, ... }.

      7. GET /positions/{accountId}/active — активные позиции: массив
      PositionResponse { idx (id позиции), market, direction, size, notional,
      margin, pnl, funding, fee, openedAt, status, ... }.

      8. GET /positions/{accountId}/portfolio/history?limit=&offset= — история
      позиций: { data: [...], totalCount }.

      9. POST /positions/{accountId}/close-all — закрыть все позиции по рынку
      (204).

      10. POST /accounts/{accountId}/close-all — отменить все ордера и закрыть
      все позиции (204).

      11. GET /orders/{accountId}/active — активные ордера.

      12. DELETE /orders/{orderId} — отменить ордер (204).

      13. PATCH /orders/{orderId} — изменить триггерную цену/amount ордера.

      14. GET /orders/{accountId}/{asset}/history — история ордеров по тикеру.


      Важные правила торговли:

      - Закрытие позиции — это ордер type: "take" с triggerPrice: "0"
      (исполняется по рынку), direction = направление позиции, positionId = idx
      позиции, amount = size позиции (base units). НЕ рыночный ордер в обратную
      сторону (он откроет вторую позицию).

      - Ответ ордера не содержит id позиции — после открытия нужно GET
      /positions/{accountId}/active и найти позицию по market+direction.

      - Стоп-лосс и тейк-профит можно прикрепить к ордеру на открытие через
      stopTriggerPrice и takeTriggerPrice.

      - amount для ордера на увеличение — quote-сумма (резерв из свободного
      баланса), для ордера на закрытие — base-размер позиции.


      Что нужно сделать:

      1. Реализовать UpscaleBroker (broker/upscale.ts или аналогично) на основе
      BaseBroker: методы getBalance/riskStatus, getPositions,
      getClosedTrades/stats, executeOrder (открытие market-ордера + чтение
      позиции), closePosition (take-ордер с triggerPrice "0"),
      closeAllPositions, getMarkets, getEquityHistory. Все числа конвертировать
      fp9 <-> human через BigInt. Обрабатывать ошибки API по коду error, ретраи
      при 429/409, x-idempotency-key для запросов на запись.

      2. Подключить UpscaleBroker в BrokerService (broker/service.ts): выбор
      брокера по BROKER_TYPE (stub | upscale), передача BROKER_API_BASE_URL и
      BROKER_API_KEY_HEADER из конфига. Для upscale API-ключ пользователя
      (usk_...) используется как Bearer-токен.

      3. /connect должен делать тестовый вызов GET /accounts/with-risk-status с
      ключом пользователя и сообщать результат (найден активный счёт, баланс,
      эквити).

      4. /status должен показывать реальные баланс, эквити, дневной/общий P&L из
      risk-status.

      5. /positions должен показывать реальные открытые позиции из
      /positions/{accountId}/active и последние закрытые из portfolio/history.

      6. /stats должен показывать реальную статистику из
      /accounts/{accountId}/stats (винрейт, профит-фактор, средний R, макс.
      просадка).

      7. Торговое ядро (engine/) должно использовать UpscaleBroker для
      execute_order: открытие через market-ордер, закрытие через take-ордер с
      triggerPrice "0".

      8. Обновить .env.example: BROKER_TYPE=stub|upscale,
      BROKER_API_BASE_URL=https://api.upscale.trade,
      BROKER_API_KEY_HEADER=Authorization. Учесть, что для upscale заголовок
      авторизации — "Authorization: Bearer <ключ>".

      9. Сохранить обратную совместимость: если BROKER_TYPE=stub или не задан —
      работает StubBroker как раньше.

      10. Проверить, что конфиг core/config.ts читает BROKER_TYPE,
      BROKER_API_BASE_URL, BROKER_API_KEY_HEADER и передаёт их в BrokerService.


      Документация Upscale была предоставлена пользователем полностью (все
      эндпоинты выше описаны по ней). Реализовать интеграцию так, чтобы бот
      работал с реальным API Upscale.
    status: completed
    acceptance_criteria:
      - Запрос пользователя выполнен полностью
    meta:
      quick_implement_marker: quick_implement:call_cdcc4595a06b44e4a10cf302
    summary: 'Реализован UpscaleBroker (broker/upscale.ts) на базе BaseBroker:
      fp9<->human через BigInt, balance/risk-status, positions, closed
      trades/stats, markets, equity-history, открытие market-ордером и закрытие
      take-ордером с triggerPrice "0"; ошибки — по коду error, ретраи 429/409,
      x-idempotency-key. В broker/factory.ts и service.ts выбор по BROKER_TYPE
      (stub|upscale) с BROKER_API_BASE_URL/BROKER_API_KEY_HEADER; /connect
      тестирует /accounts/with-risk-status. Обновлён .env.example; StubBroker
      сохранён.'
