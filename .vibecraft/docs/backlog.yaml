  - id: task-5648
    title: "Исправить расчёт размера сделки в торговом ядре
      (engine/trading-core.ts): сейчас объём сделки считается как notional ..."
    description: "Исправить расчёт размера сделки в торговом ядре
      (engine/trading-core.ts): сейчас объём сделки считается как notional =
      price * 1 (цена единицы актива), из-за чего для BTC это огромная сумма,
      которая всегда превышает лимит RiskManager balance*risk/100 (например,
      99.9 USD при балансе 9992.58 и риске 1%), и любой сигнал AI блокируется с
      ошибкой risk_per_trade_exceeded — бот не может открыть позиции. Нужно
      считать размер так: qty = min(maxTradeNotional, availableCash) / price,
      где maxTradeNotional — это лимит из RiskManager (balance * risk / 100),
      availableCash — свободные средства из снимка счёта, price — текущая цена.
      То есть объём сделки должен соответствовать лимиту риска, а не цене
      актива. Проверить, что после исправления бот может открывать позиции в
      рамках лимита риска (например, при балансе 10000 USD и риске 1% объём
      сделки ~99.9 USD, а не цена BTC)."
    status: completed
    acceptance_criteria:
      - Запрос пользователя выполнен полностью
    meta:
      quick_implement_marker: quick_implement:call_resp_01a13d4c-e62b-7cbb-82c0-429586f5401c_0
    summary: "Исправлен расчёт размера сделки в engine/trading-core.ts: вместо
      notional = price * 1 (для BTC — огромная сумма) объём теперь считается от
      лимита риска — перед checkOpenTrade вычисляется notional = min(balance ×
      effectiveRiskPercent / 100, availableCash), где effectiveRiskPercent
      учитывает aiModeMultiplier; qty = budget / price сохранён. При балансе
      10000 USD и риске 1% объём сделки ~99.9 USD, риск_per_trade_exceeded
      больше не блокирует сигналы. Проверено: npm run typecheck, lint и build
      проходят."
