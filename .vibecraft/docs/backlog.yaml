  - id: task-6612
    title: "Защитные ордера на бирже: стоп-лосс (риск%) и тейк-профит (RR) при
      открытии позиции, макс. плечо, среднее время удержания в AI-контексте"
    description:
      'При открытии позиции на брокере Upscale бот должен размещать на
      бирже защитные ордера (стоп-лосс и тейк-профит), которые висят на бирже и
      не зависят от работы бота. По документации Upscale стоп-лосс и тейк-профит
      отправляются вместе с ордером на открытие через поля stopTriggerPrice и
      takeTriggerPrice в POST /orders («Стоп-лосс и тейк-профит могут идти
      вместе с ордером на открытие»). Пользователь задаёт через /settings риск
      как размер стопа в процентах от цены входа (например риск 1% = стоп 1%),
      этот процент превращается в стоп-лосс на бирже; также нужен тейк-профит,
      который срабатывает при заданном соотношении риска к прибыли (RR),
      настраиваемом в /settings. При открытии market-ордера (POST /orders с
      type: market, amount в fp9, expectedAmount "0", leverage в fp9) в том же
      запросе должны уходить stopTriggerPrice и takeTriggerPrice в формате fp9,
      рассчитанные от цены входа/рыночной цены: для long стоп ниже цены входа,
      тейк выше; для short наоборот. Требования: размер стопа задаётся в
      настройке риска; стоп-лосс открывается ордером у брокера; позиция может
      быть открыта со стопом меньше заданного, но не больше; сделки открываются
      с максимальным плечом, разрешённым рынком/фазой, а маржа корректируется
      (риск-менеджмент подгоняет размер позиции под стоп). В ответе должны быть
      видны статусы стоп/тейк ордеров, а в логах — что защитные ордера размещены
      на бирже и висят (active). Сохранить существующую диагностику: полный
      ответ POST /orders, GET активных ордеров, ожидание позиции,
      PositionNotOpenedError при статусе ≠ executed. Также добавить в
      AI-контекст и использовать среднее время удержания сделки, чтобы AI
      ориентировался на него при принятии решений.'
    status: completed
    acceptance_criteria:
      - Пользователь задаёт риск (стоп-лосс) в процентах от цены входа через
