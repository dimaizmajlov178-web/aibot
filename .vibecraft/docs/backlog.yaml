tasks:
  - id: task-4558
    title:
      После перезапуска бота с реальным брокером Upscale (brokerType=upscale,
      dryRun=false) в логах до сих пор нет ни одной...
    description: После перезапуска бота с реальным брокером Upscale
      (brokerType=upscale, dryRun=false) в логах до сих пор нет ни одной записи
      от торгового цикла (ни сбора данных и запроса к AI, ни сигналов, ни hold,
      ни risk_block, ни trade_open, ни ошибок) — только строки запуска. Позиции
      на брокере не открываются. Нужно найти и исправить причину, по которой
      торговый цикл не запускается или молча пропускает итерации, чтобы бот
      начал анализировать рынок через DeepSeek и открывать позиции в рамках
      лимита риска, а все шаги цикла (старт с интервалом и числом пользователей,
      сбор данных и запрос к AI, сигнал/hold, risk_block, открытие/закрытие
      сделок, ошибки и диагностика тихих веток) были видны в логах.
    status: completed
    acceptance_criteria:
      - Запрос пользователя выполнен полностью
    meta:
      quick_implement_marker: quick_implement:call_6ddddccef84e46ae823d0699
    summary: |-
      Торговый цикл после перезапуска бота молчал, потому что первый тик
      выполнялся только после первого интервала (по умолчанию 5 минут),
      а ошибки чтения списка пользователей в tick()/runForEvent() молча
      проглатывались. Исправлено в engine/trading-core.ts: первый tick
      запускается сразу после старта цикла, ошибки resolveUserIds теперь
      логируются как error, добавлена диагностика итераций (число
      пользователей) и ветки «у пользователя нет разрешённых символов».
      В bot/bot.ts уточнён стартовый лог цикла. Теперь сразу после рестарта
      в логах видны шаги цикла: анализ рынка через DeepSeek, сигнал/hold,
      risk_block, открытие/закрытие сделок и ошибки.
  - id: task-0848
    title:
      Выдать полный актуальный код файлов engine/trading-core.ts и bot/bot.ts
      для замены на сервере
    description: "Пользователь просит выдать полный код файлов, которые нужно
      заменить на сервере, чтобы торговый цикл заработал (в логах после запуска
      нет ни одной записи от цикла). Нужно прочитать актуальную реализацию
      engine/trading-core.ts и bot/bot.ts в репозитории проекта и выдать их
      полный текст, готовый к копированию, вместе с краткой инструкцией по
      замене на сервере (запись файла через cat > файл << 'EOF' ... EOF, затем
      docker compose restart bot и проверка логов). Файлы проекта менять нельзя
      — это readonly-задача. Ответ пользователю записать в summary
      completed-задачи: полный код обоих файлов и краткая инструкция по их
      замене и перезапуску бота."
    status: completed
    acceptance_criteria:
      - Задача завершена со статусом completed
      - В summary задачи содержится полный актуальный код файлов
        engine/trading-core.ts и bot/bot.ts, готовый к копированию и замене на
        сервере, и краткая инструкция по замене файлов и перезапуску бота
    summary: "task-0848 (readonly): выданы актуальные файлы торгового цикла для
      замены на сервере. Основная реализация исправленного цикла —
      engine/trading-core.ts (первый tick сразу после старта, диагностика пустых
      веток, rate-limit backoff, защита от дублей через lockStore) и bot/bot.ts
      (сборка TradingCore и onEvent-логирование шагов цикла в лог). Ниже полный
      код обоих файлов и инструкция:


      # Замена файлов торгового цикла на сервере

      # 1) Подключитесь к серверу, зайдите в каталог проекта (там, где лежит
      docker-compose.yml)

      # 2) Запишите файлы через heredoc (копируйте блок целиком):


      cat > engine/trading-core.ts << 'EOF'

      import type { BaseBroker, PositionSide } from \"../broker/base\";

      import { UpscaleApiError } from \"../broker\";

      import type { AnalyzeResult, AiAnalysisService } from \"../ai/service\";

      import type { TradeSignal } from \"../ai/schema\";

      import type { MarketDataProvider } from \"../ai/market-data\";

      import { isSymbolAllowed, type TradingSettings } from \"./types\";

      import {

      \  RiskManager,

      \  aiModeMultiplier,

      \  type BrokerSnapshot,

      } from \"./risk-manager\";

      import { OrderExecutor } from \"./executor\";

      import type { LockStore } from \"./lock\";

      import type { LearningRecorder } from \"../learning/types\";

      import type { AuditService } from \"../core/audit\";

      import { createRequestId } from \"../core/request-id\";


      export const DEFAULT_DECISION_INTERVAL_MS = 300_000;

      export const DEFAULT_LOCK_TTL_MS = 30_000;

      /** Пауза перед следующей итерацией после ошибки rate limit брокера (429).
      */

      export const RATE_LIMIT_BACKOFF_MS = 5_000;


      export type EngineEventType =

      \  | \"signal\"

      \  | \"trade_open\"

      \  | \"trade_close\"

      \  | \"risk_block\"

      \  | \"dup_skip\"

      \  | \"admin_notify\"

      \  | \"pause_changed\"

      \  | \"error\"

      \  | \"diagnostic\";


      export interface EngineEvent {

      \  type: EngineEventType;

      \  userId: number;

      \  symbol: string;

      \  side?: PositionSide;

      \  message: string;

      \  data?: Record<string, unknown>;

      \  at: string;

      \  requestId?: string;

      }


      export interface TradingCoreDeps {

      \  riskManager: RiskManager;

      \  executor: OrderExecutor;

      \  lockStore: LockStore;

      \  ai: AiAnalysisService;

      \  marketData: MarketDataProvider;

      \  resolveBroker: (userId: number) => Promise<BaseBroker | null>;

      \  resolveUserIds: () => Promise<number[]>;

      \  /** Колбэк уведомления админа (например, при общей просадке). */

      \  notifyAdmin?: (userId: number, message: string) => void;

      \  /** Все известные символы, доступные для торговли. */

      \  supportedSymbols: readonly string[];

      \  decisionIntervalMs?: number;

      \  lockTtlMs?: number;

      \  /** Внешний наблюдатель событий (телеметрия/логирование). */

      \  onEvent?: (event: EngineEvent) => void;

      \  /** Запись датасета сделок для самообучения. */

      \  learning: LearningRecorder;

      \  /** Глобальная пауза (/global_pause): при true торговля остановлена у
      всех. */

      \  isGlobalPaused?: () => Promise<boolean> | boolean;

      \  /** Журнал аудита (торговые действия, риск-блокировки, ошибки). */

      \  audit?: AuditService;

      }


      function roundQuantity(value: number): number {

      \  if (value <= 0) {

      \    return 0;

      \  }

      \  return Math.round(value * 10_000) / 10_000;

      }


      /**

      \ * Торговое ядро: запускает цикл решений по таймеру и по событиям

      \ * (закрытие свечи, резкое движение), исполняет ордера через

      \ * broker.execute_order() с ретраями, применяет риск-контроль и защиту

      \ * от дублей.

      \ */

      export class TradingCore {

      \  private readonly decisionIntervalMs: number;

      \  private readonly lockTtlMs: number;

      \  private readonly supportedSymbols: readonly string[];

      \  private timer: ReturnType<typeof setInterval> | null = null;

      \  private running = false;


      \  constructor(private readonly deps: TradingCoreDeps) {

      \    this.decisionIntervalMs =

      \      deps.decisionIntervalMs ?? DEFAULT_DECISION_INTERVAL_MS;

      \    this.lockTtlMs = deps.lockTtlMs ?? DEFAULT_LOCK_TTL_MS;

      \    this.supportedSymbols = [...deps.supportedSymbols];

      \  }


      \  /** Запускает цикл решений по таймеру. */

      \  start(): void {

      \    if (this.running) {

      \      return;

      \    }

      \    this.running = true;

      \    this.emit(

      \      event(

      \        \"diagnostic\",

      \        0,

      \        \"\",

      \        `торговый цикл запущен: интервал ${this.decisionIntervalMs} мс`,

      \        {

      \          decisionIntervalMs: this.decisionIntervalMs,

      \          lockTtlMs: this.lockTtlMs,

      \          symbols: this.supportedSymbols,

      \        },

      \        createRequestId()

      \      )

      \    );

      \    // Первый тик выполняем сразу после старта, а не дожидаясь первого

      \    // интервала (по умолчанию 5 минут): иначе после перезапуска бота,
      пока

      \    // дойдёт первый tick, торговый цикл молчит, и в логах видны только
      строки

      \    // запуска.

      \    void this.tick().catch((error) => this.onTickFatal(error));

      \    this.timer = setInterval(() => {

      \      void this.tick().catch((error) => this.onTickFatal(error));

      \    }, this.decisionIntervalMs);

      \    this.timer.unref?.();

      \  }


      \  /** Останавливает таймер. Команда-резерв для /global_pause. */

      \  stopPumping(): void {

      \    if (this.timer) {

      \      clearInterval(this.timer);

      \      this.timer = null;

      \    }

      \    this.running = false;

      \  }


      \  /**

      \   * Последняя линия защиты: исключение никогда не должно выходить из
      tick()

      \   * в `void this.tick()` (иначе unhandled rejection роняет процесс).

      \   */

      \  private onTickFatal(error: unknown): void {

      \    const requestId = createRequestId();

      \    try {

      \      this.emit(

      \        event(

      \          \"error\",

      \          0,

      \          \"\",

      \          `Необработанная ошибка торгового цикла: ${

      \            error instanceof Error ? error.message : String(error)

      \          }`,

      \          { requestId },

      \          requestId

      \        )

      \      );

      \    } catch {

      \      // Ошибка наблюдателя не должна ронять процесс.

      \    }

      \  }


      \  /** Полный цикл решений по таймеру для всех пользователей и символов.
      */

      \  async tick(): Promise<void> {

      \    const requestId = createRequestId();

      \    let userIds: number[];

      \    try {

      \      userIds = await this.deps.resolveUserIds();

      \    } catch (error) {

      \      // Если БД/репозиторий подключений недоступен — цикл не должен
      молча

      \      // пропускать итерацию: пишем ошибку, чтобы причина была видна в
      логах.

      \      this.emit(

      \        event(

      \          \"error\",

      \          0,

      \          \"\",

      \          `Ошибка чтения списка подключённых пользователей: ${

      \            error instanceof Error ? error.message : String(error)

      \          }`,

      \          { source: \"timer\" },

      \          requestId

      \        )

      \      );

      \      return;

      \    }


      \    if (userIds.length === 0) {

      \      // Самая частая причина «пустых» логов: боту не для кого торговать.

      \      // Пишем диагностику, чтобы это было очевидно, а не молчанием.

      \      this.emit(

      \        event(

      \          \"diagnostic\",

      \          0,

      \          \"\",

      \          \"торговый цикл: нет подключённых пользователей (выполните
      /connect в боте)\",

      \          { source: \"timer\" },

      \          requestId

      \        )

      \      );

      \      return;

      \    }


      \    for (const userId of userIds) {

      \      let symbols: string[];

      \      try {

      \        symbols = await this.symbolsForUser(userId);

      \      } catch (error) {

      \        this.emit(

      \          event(

      \            \"error\",

      \            userId,

      \            \"\",

      \            `Ошибка чтения настроек пользователя ${userId}: ${

      \              error instanceof Error ? error.message : String(error)

      \            }`,

      \            { source: \"timer\" },

      \            requestId

      \          )

      \        );

      \        continue;

      \      }

      \      if (symbols.length === 0) {

      \        // Тихая ветка: пользователь есть, но whitelist не совпадает ни с

      \        // одним поддерживаемым символом. Раньше цикл молча ничего не
      делал.

      \        this.emit(

      \          event(

      \            \"diagnostic\",

      \            userId,

      \            \"\",

      \            \"торговый цикл: у пользователя нет символов для торговли
      (whitelist не пересекается с поддерживаемыми)\",

      \            { source: \"timer\" },

      \            requestId

      \          )

      \        );

      \        continue;

      \      }

