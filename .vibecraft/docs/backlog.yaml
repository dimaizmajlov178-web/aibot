version: 1
tasks:
  - id: task-0613
    title: "Каркас бота: запуск, /start и /help"
    description:
      "Создать каркас Telegram-бота: запуск приложения, базовые команды
      /start и /help, структура модульного монолита с папками bot/, broker/,
      ai/, engine/, learning/, subscriptions/, admin/, db/, core/. Цель: дать
      первый видимый результат — работающий бот с приветствием и инструкцией."
    status: completed
    acceptance_criteria:
      - Бот запускается одной командой и подключается к Telegram
      - /start показывает приветствие и краткую инструкцию
      - /help показывает список доступных команд
      - "Структура проекта соответствует модульному монолиту: bot/, broker/,
        ai/, engine/, learning/, subscriptions/, admin/, db/, core/"
    summary:
      "Реализован каркас Telegram-бота на telegraf (Node.js/TS): запуск одной
      командой `npm run bot:start`, подключение к Telegram через
      TELEGRAM_BOT_TOKEN (long polling), команды /start (приветствие и
      инструкция) и /help (список команд). Структура модульного монолита
      создана: bot/, broker/, ai/, engine/, learning/, subscriptions/, admin/,
      db/, core/. Основная реализация в bot/index.ts, bot/bot.ts,
      core/config.ts; прочие модули — заглушки на последующие задачи."
  - id: task-2927
    title: Привязка брокера и контроль счёта
    description: "Реализовать привязку брокера и контроль счёта: абстрактный
      BaseBroker и заглушку StubBroker с фейковыми данными, пошаговую привязку
      API-ключа через /connect с тестовым вызовом balance, команды /status,
      /positions, /stats. Ключ шифруется и хранится только в зашифрованном
      виде."
    status: completed
    acceptance_criteria:
      - Пользователь привязывает API-ключ брокера через /connect, бот делает
        тестовый вызов balance и сообщает результат
      - /status показывает баланс, открытые позиции, дневной и общий P&L
      - /positions показывает открытые и последние закрытые сделки
      - /stats показывает винрейт, профит-фактор, средний R, максимальную
        просадку
      - API-ключ хранится только в зашифрованном виде, админ не видит ключи
        пользователей
      - До получения реального API брокера работает StubBroker с фейковыми
        данными
    summary:
      "Реализованы абстрактный BaseBroker и StubBroker с детерминированными
      фейковыми данными (баланс, позиции, закрытые сделки, статистика).
      Пошаговая привязка API-ключа через /connect: ключ валидируется zod, бот
      делает тестовый вызов balance и сообщает результат; команды /status,
      /positions, /stats показывают счёт, сделки и метрики (винрейт,
      профит-фактор, средний R, просадка), есть /disconnect и /cancel. Ключ
      шифруется AES-256-GCM (ENCRYPTION_KEY) и хранится только в зашифрованном
      виде в db/broker-repository.ts; админ не видит ключи. Основная реализация:
      broker/ (base.ts, stub.ts, service.ts), core/crypto.ts, bot/ (connect.ts,
      account.ts, format.ts)."
  - id: task-0995
    title: AI-анализ через DeepSeek
    description: "Реализовать AI-анализ через DeepSeek: сбор рыночных данных и
      индикаторов, формирование структурированного промта (роль, контекст рынка,
      история по активу, состояние портфеля, запрос строгого JSON), парсинг
      ответа с валидацией схемы, логирование каждого запроса и ответа в
      ai_decisions."
    status: completed
    acceptance_criteria:
      - AI-цикл собирает рыночные данные (OHLCV, RSI, MACD, EMA 20/50/200, ATR,
        объём, CVD, VWAP-отклонение) и формирует структурированный промт для
        DeepSeek
      - "Ответ DeepSeek парсится с валидацией схемы (pydantic), невалидный ответ
        не приводит к ошибке: повторный запрос или пропуск цикла"
      - Каждый запрос и ответ логируются в ai_decisions (промт, ответ, latency,
        токены)
      - Используются deepseek-chat для быстрых решений и deepseek-reasoner для
        глубокого разбора
    summary:
      "Реализован AI-цикл анализа через DeepSeek: сбор OHLCV и индикаторов
      (RSI, MACD, EMA 20/50/200, ATR, объём, CVD, VWAP-отклонение),
      структурированный промт (роль, контекст рынка, история по активу,
      состояние портфеля, строгий JSON). Ответ парсится и валидируется
      zod-схемами (аналог pydantic для TS): невалидный ответ не ломает цикл —
      повторный запрос либо пропуск итерации. Каждый запрос/ответ логируется в
      ai_decisions (промт, ответ, latency, токены); клиент поддерживает
      deepseek-chat и deepseek-reasoner. Основная реализация: ai/service.ts,
      ai/deepseek.ts, ai/indicators.ts, ai/prompt.ts, ai/parser.ts,
      db/ai-decision-repository.ts + таблица ai_decisions в DynamoDB."
  - id: task-1623
    title: Торговое ядро и риск-контроль
    description:
      "Реализовать торговое ядро и риск-контроль: цикл решений по таймеру
      и событиям, исполнение ордеров через broker.execute_order() с обработкой
      ошибок и ретраями, жёсткие правила риск-менеджмента (макс. % на сделку,
      макс. позиций, дневная и общая просадка, лимит сделок в день), проверки
      перед каждым ордером (брокер разрешает, маржа, whitelist символов), защита
      от дублей через Redis, команды /pause, /resume, /settings."
    status: completed
    acceptance_criteria:
      - Торговое ядро запускает цикл решений по таймеру и по событиям (закрытие
        свечи, резкое движение)
      - Движок открывает и закрывает сделку через broker.execute_order() с
        обработкой ошибок и ретраями
      - "Риск-менеджмент блокирует сделки при превышении лимитов: % баланса на
        сделку, максимум позиций, лимит сделок в день"
      - При дневной просадке выше лимита торговля автоматически ставится на
        паузу до следующего дня
      - При общей просадке выше лимита торговля останавливается и админ получает
        уведомление
      - /pause и /resume позволяют пользователю остановить и возобновить торговлю
      - /settings позволяет настроить риск на сделку, максимум позиций, список
        символов и режим AI
      - Защита от дублей через Redis-блокировку на символ+направление
    summary:
      "Реализовано торговое ядро (engine/trading-core.ts): цикл решений по
      таймеру, событиям закрытия свечи и резкого движения; исполнение ордеров
      через broker.execute_order() с ретраями (engine/executor.ts).
      Риск-менеджмент (engine/risk-manager.ts) блокирует сделки по % на сделку,
      максимуму позиций, лимиту сделок в день, дневной (автопауза до след. дня)
      и общей (автостоп с уведомлением админу) просадке, whitelist-символам и
      марже. Защита от дублей через блокировку символ+направление
      (engine/lock.ts, Redis-совместимая с in-memory фолбэком). В бот добавлены
      /pause, /resume, /settings (bot/control.ts); новые таблицы
      trading_settings и trading_state в DynamoDB. Основная реализация: engine/
      и broker/base.ts."
  - id: task-4237
    title: Самообучение на истории сделок
    description:
      "Реализовать самообучение без fine-tuning: сбор датасета из сделок
      со снимками контекста, суточный learning-отчёт через DeepSeek,
      версионирование стратегий с автоматическим расчётом метрик, A/B режим
      сравнения стратегий, анти-оверфит ограничения, откат стратегии админом."
    status: completed
    acceptance_criteria:
      - Каждая сделка сохраняет снимок контекста (рынок, индикаторы, решение AI,
        reasoning) и результат
      - "Раз в сутки генерируется learning-отчёт через DeepSeek: анализ
        последних сделок, паттерны успехов/неудач, корректировки правил"
      - При наличии изменений создаётся новая версия стратегии с автоматическим
        расчётом метрик (винрейт, профит-фактор, просадка)
      - Поддерживается A/B режим сравнения текущей и тестовой стратегии
      - "Действуют анти-оверфит ограничения: глубина истории (последние 60
        дней), минимум 30 сделок для правил"
      - Админ может откатить стратегию на любую предыдущую версию
    summary: "Реализовано самообучение без fine-tuning: сделки сохраняют снимок
      контекста (рынок, индикаторы, решение AI, reasoning) и результат; суточный
      learning-отчёт через DeepSeek; новые версии стратегий с авторасчётом
      метрик (винрейт, PF, просадка); A/B-сравнение и откат админом;
      анти-оверфит (60 дней, 30 сделок). Команды /learning, /strategy,
      /strategy_ab; реализация: learning/."
  - id: task-1963
    title: Подписки и админ-панель
    description:
      "Реализовать подписки и админ-панель: роли admin/subscriber/guest,
      таблица users с подпиской, админ-команды /admin, /grant, /revoke, /users,
      /broadcast, /global_pause, проверка активной подписки на каждом защищённом
      хендлере."
    status: completed
    acceptance_criteria:
      - Админ выдаёт и отзывает доступ через /admin (/grant, /revoke)
      - /users показывает список пользователей
      - /broadcast отправляет сообщение всем пользователям
      - /global_pause останавливает торговлю у всех
      - Пользователь без активной подписки не может пользоваться защищёнными
        функциями
      - Админ-команды видны только пользователям из ADMIN_TELEGRAM_IDS
    summary: "Реализованы подписки и админ-панель: роли admin/subscriber/guest,
      таблицы users и global_state в DynamoDB (мигрированы). SubscriptionService
      (subscriptions/service.ts) выдает/отзывает подписку со сроком и проверяет
      активность; guard-мидлварь в bot/bot.ts закрывает защищённые хендлеры без
      подписки. Админ-команды /admin, /grant, /revoke, /users, /broadcast,
      /global_pause (admin/commands.ts) доступны только из ADMIN_TELEGRAM_IDS и
      видны в /help только админам; /global_pause останавливает торговлю у всех
      через TradingCore.isGlobalPaused."
  - id: task-0909
    title: Безопасность, шифрование и аудит
    description:
      "Реализовать безопасность и аудит: шифрование API-ключей Fernet с
      ключом из .env, хранение только шифра в БД, аудит всех торговых действий и
      изменений настроек в audit_log, конфигурация только через .env,
      структурированные логи с user_id и request_id."
    status: completed
    acceptance_criteria:
      - API-ключи брокера шифруются (Fernet, ключ из .env), в БД хранится только
        шифр
      - Админ не видит API-ключи пользователей
      - Все торговые действия и изменения настроек пишутся в audit_log (кто,
        когда, что)
      - Секреты только через .env, в коде нет хардкодов
      - "Конфигурация читается из .env: TELEGRAM_BOT_TOKEN, DEEPSEEK_API_KEY,
        ENCRYPTION_KEY, DATABASE_URL, REDIS_URL, ADMIN_TELEGRAM_IDS,
        BROKER_API_BASE_URL, BROKER_API_KEY_HEADER, DEFAULT_RISK_PER_TRADE,
        MAX_POSITIONS, DAILY_DRAWDOWN_LIMIT, TOTAL_DRAWDOWN_LIMIT"
    summary: "Реализованы безопасность и аудит: API-ключи брокера шифруются
      Fernet-ом (core/crypto.ts, ключ из ENCRYPTION_KEY, перекрёстно проверен с
      эталонной Python-реализацией cryptography), в БД (broker_connections)
      хранится только шифр + отпечаток; админ не видит ключи. Добавлена таблица
      audit_log (DynamoDB + in-memory) и AuditService (core/audit.ts): в журнал
      пишутся все торговые действия (trade.open/close/rejected/error), изменения
      настроек (settings.update), паузы/возобновление, подключение брокера,
      админ-действия и управление стратегиями — кто, когда, что. Секреты и
      дефолты риска читаются только из .env (core/config.ts, lib/db.ts,
      .env.example); структурные JSON-логи с userId и requestId через
      core/logger.ts + requestId-мидлварь бота (bot/request-context.ts)."
