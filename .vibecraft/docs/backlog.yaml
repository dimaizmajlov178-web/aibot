      риск-менеджмент и парсинг AI-ответа с покрытием ядра ≥ 70%, и
      docker-compose, который поднимает весь проект одной командой.
    status: completed
    acceptance_criteria:
      - pytest + pytest-asyncio настроены, покрытие ядра ≥ 70%
      - Есть тесты на торговое ядро, риск-менеджмент и парсинг AI-ответа
      - docker-compose поднимает весь проект одной командой (бот, БД, Redis)
      - Type hints везде, Pydantic v2 для DTO и конфигов, async-first
    summary: "Добавлены pytest + pytest-asyncio тесты на Python-ядро (pycore/):
      торговое ядро (trading_core.py), риск-менеджмент (risk_manager.py) и
